name: Build Windows Portable EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 6 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore KajimiDiskCleaner.csproj -r win-x64

      - name: Build single portable EXE
        shell: pwsh
        run: .\build-portable.ps1

      - name: Verify output
        shell: pwsh
        run: |
          $files = @(Get-ChildItem .\dist -File)
          if ($files.Count -ne 1 -or $files[0].Extension -ne '.exe') {
            throw "Expected exactly one EXE in dist, found: $($files.Name -join ', ')"
          }
          "Portable EXE: $($files[0].Name) ($([math]::Round($files[0].Length / 1MB, 2)) MB)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KajimiDiskCleaner-win-x64-portable
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "卡吉米磁盘清理助手 $tag" --generate-notes
          }
          gh release upload $tag .\dist\KajimiDiskCleaner.exe --clobber

